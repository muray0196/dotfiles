name: search-stack

services:
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "2"
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - search

  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-docker.io/unclecode/crawl4ai:0.8.5}
    container_name: crawl4ai
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_HOOKS_ENABLED: "false"
    networks:
      - search

networks:
  search:
    name: search-stack
