use_default_settings: true

general:
  instance_name: "Local Search"

search:
  safe_search: 0
  formats:
    - html
    - json

engines:
  # Override the built-in entry instead of creating an alias: SearXNG keys
  # persisted locale/domain traits by engine name.
  - name: google cse
    engine: google_cse
    shortcut: goc
    categories:
      - general
      - web
    page_size: 3
    disabled: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: true
