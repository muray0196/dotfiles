name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 shellcheck stow zsh
      - name: Run smoke tests
        run: ./tests/smoke.sh
